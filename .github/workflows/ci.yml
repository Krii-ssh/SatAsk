name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  controller:
    name: Controller and GeoChat agent tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            controller/requirements.txt
            AI/geochat/requirements.txt
      - name: Install dependencies
        run: pip install -r controller/requirements.txt -r AI/geochat/requirements.txt
      - name: Controller tests (offline, mocks on)
        working-directory: controller
        run: python tests.py
      - name: GeoChat agent tests (stub backend)
        working-directory: AI/geochat
        run: python tests.py

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  backend:
    name: Backend install and syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node --check index.js && node --check routes/query.js && node --check routes/models.js
